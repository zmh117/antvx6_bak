services:
  postgres:
    image: postgres:latest
    container_name: antvx6-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-antvx6}
    volumes:
      # postgres:18+ 官方推荐挂载点；数据落在项目 ./data
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  collab:
    image: node:22-alpine
    container_name: antvx6-collab
    working_dir: /app/collab
    command: sh -c "npm install && npm run start"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    environment:
      COLLAB_PORT: ${COLLAB_PORT:-1234}
      API_BASE: ${API_BASE:-http://host.docker.internal:8001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-antvx6}
      JWT_SECRET: ${JWT_SECRET:-dev-antvx6-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-antvx6}
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:-dev-collab-internal-token}
    volumes:
      - .:/app
      - collab_node_modules:/app/collab/node_modules

volumes:
  collab_node_modules:
